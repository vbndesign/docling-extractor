gate: PASS
status_reason: >
  All 9 ACs met. AC1/AC7a/AC7e (chunker splits and small-PDF bypass)
  covered by dedicated unit tests. AC2 (≥90% char-ratio on large PDFs)
  exercised by `test_extract_large_pdf_succeeds_with_full_coverage`
  against the synthetic `large_text.pdf` fixture (104 pages). AC3/AC4/AC5
  (partial aggregation, frontmatter emission, HTMX warning) covered by
  three integration tests against both JSON and HTML branches. AC6
  (timeout 60→600) applied in Settings. AC8 (no regression) validated —
  97/97 tests pass in 9.55 s warm run. AC9 (<60 s suite, lint) green.
  Crucially, empirical validation against the author's real 104-page PDF
  (Task 10 first half) now confirms the design works end-to-end:
  144 800 body chars in the generated `.md` vs. 145 046 chars from the
  @dev D1/D2 probes (99.83% match); frontmatter omits `partial:` (FR4
  compliant); bug-era output was 23 325 chars, so the hotfix restores
  6.21× more content.

  The hotfix in Change Log v1.3 (disabling `do_ocr` at lifespan
  instantiation) is surgical, well-justified inline, and closes a real
  gap: the Story 1.7 Dev Notes asserted `do_ocr` was "irrelevant" to the
  heap-leak root cause — which is true — but omitted that the Docling
  default `do_ocr=True` dominates wall-clock time on native-text PDFs,
  turning the chunked path into a 504 even with the new 600 s timeout.
  Aligning the runtime with the product stance already advertised in the
  README ("v1 has no OCR") was the correct call. Scanned-PDF guard
  (`_guard_non_empty_markdown` → 422 with OCR hint) remains covered by
  `test_extract_scanned_pdf_maps_to_422_with_ocr_hint`.

top_issues:
  - id: "DOC-001"
    severity: low
    file: "docs/stories/1.7.large-pdf-chunked-extraction.md"
    finding: >
      The story's Dev Notes (Previous Story Insights) state that
      `do_ocr` is "irrelevant for this problem. Don't waste time there."
      That guidance was scoped to the heap-leak investigation and is
      correct in that context — but Completion Note #10 now documents
      that `do_ocr` is in fact the dominant factor for wall-clock time
      on native-text PDFs, driving 504s even with chunking in place.
      Readers who only skim Dev Notes (not Completion Notes) may
      misapply the original guidance in future work.
    suggested_action: >
      Keep as-is for this story (Completion Note #10 is the canonical
      record). If a future story touches Docling pipeline knobs,
      consider a one-line pointer in the Dev Notes of that story that
      "do_ocr affects wall-clock time but not heap retention — see
      Story 1.7 Completion Note #10."

  - id: "TEST-001"
    severity: low
    file: "backend/main.py"
    finding: >
      The `do_ocr=False` wiring in lifespan is not covered by a unit
      test asserting that `app.state.converter` was instantiated with
      `PdfPipelineOptions(do_ocr=False)`. A silent regression to the
      Docling default (or a future refactor swapping `PdfFormatOption`
      for a different binding) would not be caught by the existing
      suite until a user submits a real 100-page PDF and reports a 504
      again. The scanned-PDF test covers the product-facing contract
      (422 with OCR hint) but not the performance contract.
    suggested_action: >
      Optional: add a unit test under `tests/test_endpoints.py` or a
      new `tests/test_lifespan.py` that asserts, during app startup,
      the active converter's PDF pipeline options have `do_ocr=False`.
      Low priority — the inline comment in `main.py:62–67` documents
      the intent clearly, and the next user-facing regression would
      be caught in manual E2E. Register as tech debt if not addressed
      in Story 1.8.

  - id: "PERF-001"
    severity: low
    file: "tests/test_endpoints.py"
    finding: >
      First cold run of the full suite clocks ~73 s on Python 3.14.0
      due to pytest_asyncio deprecation-warning machinery (~4133
      warnings logged). Warm runs are 9–14 s (well within AC9). The
      AC9 budget is about real test execution, not Python startup
      theatre — so not a violation — but contributors running the
      suite for the first time after `uv sync` may be confused by
      the apparent 5× slowdown.
    suggested_action: >
      Either pin `pytest-asyncio` to a release compatible with Python
      3.14 without the deprecation spam, or add a short note in
      `README.md` under "Testes" that the first cold run is slower
      due to Python import caching. Non-blocking.

