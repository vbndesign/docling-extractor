hotfix_v1.3_review:
  scope: >
    `backend/main.py` lifespan: instantiate `DocumentConverter` with
    `PdfPipelineOptions(do_ocr=False)` via `PdfFormatOption`.
    `tests/conftest.py`: `_DummyConverterForApp.__init__` now accepts
    `*args, **kwargs` to tolerate the new call shape.
  assessment: PASS
  findings:
    - Fix is surgical (2 files, ~10 LOC net) and correctly scoped.
    - Inline comment in `main.py:62–67` explains the why with evidence
      references (README alignment, Story 1.7 D1/D2 probe baseline).
    - Completion Note #10 and Change Log v1.3 in the story file are
      accurate and link cause to effect.
    - Scanned-PDF 422 contract preserved and still green
      (`test_extract_scanned_pdf_maps_to_422_with_ocr_hint`).
    - No test coverage drop — the tightened conftest dummy accepts
      arbitrary kwargs, keeping the sentinel contract intact.

