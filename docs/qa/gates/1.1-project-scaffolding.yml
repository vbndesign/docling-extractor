observations:
  - severity: low
    category: code
    file: "backend/config.py:22"
    description: "`_load_settings()` currently duplicates `get_settings()` with no behavioural difference; the private wrapper adds no value yet."
    recommendation: "Either inline it now, or keep as-is but give `get_settings()` a real role (e.g., lru_cache, dependency_overrides test hook) when Story 1.2 introduces the first TestClient test."
    blocking: false
  - severity: low
    category: code
    file: "backend/config.py:24-26"
    description: "int() on env values has no bounds check — a negative or zero `MAX_UPLOAD_MB` / `REQUEST_TIMEOUT_SECONDS` would be accepted and could silently break Story 1.4 limits, while `OUTPUT_DIR` is stored as-is (no ~ expansion, no resolution)."
    recommendation: "Defer to Story 1.2/1.3 — add positive-int validation on Settings fields (either post_init or pydantic-settings adoption) and `.expanduser().resolve()` on output_dir where file_writer composes paths."
    blocking: false

