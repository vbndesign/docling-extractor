      expectations.
    status: MET
    evidence: >
      tests/test_endpoints.py now has all six named tests:
      `test_extract_url_returns_404_maps_to_502` (a, line 177),
      `test_extract_empty_html_maps_to_422` (b, 343),
      `test_extract_scanned_pdf_maps_to_422_with_ocr_hint` (c, 365),
      `test_extract_non_pdf_file_maps_to_400` (d, 384),
      `test_extract_oversized_upload_maps_to_413` (e, 168),
      `test_extract_conversion_timeout_maps_to_504` (f, 218).
      All six pass.
  - id: AC2
    description: >
      Scanned-PDF case returns a clear "OCR not enabled in v1" error
      rather than writing an empty .md.
    status: MET
    evidence: >
      `_guard_non_empty_markdown` in backend/docling_service.py
      (L215–237) checks stripped markdown length against
      `_MIN_MARKDOWN_CHARS = 10` and raises ConversionError with the
      exact hint "PDF appears to be scanned without extractable text.
      OCR is not enabled in v1." for any non-HTML source.
      `test_extract_scanned_pdf_maps_to_422_with_ocr_hint` asserts both
      "OCR" and "v1" are present in `body["message"]` — PASS.
  - id: AC3
    description: >
      README includes all 10 required sections (Visão geral,
      Pré-requisitos, Instalação, Como rodar, Como usar with Swagger
      UI, Troubleshooting, Estrutura, Limitações v1, Roadmap v2, Testes).
    status: MET
    evidence: >
      Grep on README.md heading lines confirms all 10 sections plus the
      explicit Swagger UI subsection pointing to
      http://127.0.0.1:8000/docs (S4). Troubleshooting covers the 4
      story-required scenarios (first-boot model download, scanned PDFs,
      SPA URLs, port-in-use) plus a bonus local_path-quoted-path tip.
  - id: AC4
    description: >
      `ruff check backend tests` and `ruff format --check backend tests`
      both pass with no pending changes.
    status: MET
    evidence: >
      Independently re-ran both in this gate: "All checks passed!" and
      "15 files already formatted".
  - id: AC5
    description: "pytest suite runs in <60 s on a typical dev machine."
    status: MET
    evidence: >
      82 passed in 8.89s (pytest internal) / ~11.85s wall time.
      Headroom: ~85%. `[tool.pytest.ini_options]` now registers the
      `slow` marker and enforces `-m 'not slow'` by default — forward-
