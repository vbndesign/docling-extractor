  - id: AC6
    description: "QA gate returns PASS or CONCERNS."
    status: MET
    evidence: "This gate — verdict PASS."
  - id: AC7
    description: >
      Author executes 5 real E2E flows (3 source types + local_path +
      1 error case) and confirms each produces the expected result.
    status: DEFERRED_TO_AUTHOR
    evidence: >
      By story design this AC cannot be executed by @qa — it requires
      the author's machine, network, and real PDFs. The checklist at
      `docs/qa/story-1.6-e2e-validation.md` is complete, well-structured,
