top_issues:
  - id: "MNT-001"
    severity: low
    file: "backend/docling_service.py"
    finding: >
      `_MIN_MARKDOWN_CHARS = 10` is an arbitrary threshold. A legitimate
      tiny document (e.g., a one-word poster scan, a business-card PDF
      with a single short label) would be misclassified as "scanned
      without text" and trip the guard with an OCR-specific error message.
      The probability of that happening in this tool's intended use case
      (literature notes: articles, papers) is extremely low, and the
      trade-off is explicitly called out in the adjacent comment, so this
      is an accepted-design note rather than a defect.
    suggested_action: >
      Keep as-is for v1. If a false positive surfaces in real use, the
      threshold is one line to tune, or replace with a richer heuristic
      (e.g., word count, character density per page).

  - id: "MNT-002"
    severity: low
    file: "backend/docling_service.py"
    finding: >
      After `ruff format`, `HTTP_ACCEPT` is laid out as two adjacent
      string literals on a single line inside a parenthesized expression:
      `"text/html,...;q=0.9," "application/pdf;q=0.9,*/*;q=0.8"`. Python
      concatenates implicitly at parse time so the runtime string is
      identical to pre-format behavior, but the visual form is mildly
      awkward. Cosmetic only; no functional impact.
    suggested_action: >
      Optional: rewrite as a single literal or insert a `+` between the
      pieces if the double-quoted visual form bothers a future reader.
      Do not fight ruff format for aesthetic preference.

  - id: "MNT-003"
    severity: low
    file: "tests/test_docling_service.py"
    finding: >
      The pre-existing `test_http_client_sends_user_agent` had its stub
      markdown updated from `"# x\n"` (3 stripped chars) to
      `"# Title\n\nBody paragraph extracted by the mock.\n"` so it would
      not trip the new empty-markdown guard. The test's contract (header
      propagation) is unchanged; this is a legitimate fixture update, not
      a weakened assertion. Noted here only so the handoff to any
      follow-up reviewer is explicit.
    suggested_action: None — informational only.

  - id: "DOC-001"
    severity: low
    file: "backend/errors.py"
    finding: >
      `ERROR_CATALOG["CONVERSION_FAILED"]` hint still reads "Source may
      be corrupted, empty, or a scanned PDF (OCR not supported in v1)."
      That is a superset of what the per-exception `message` now
      surfaces for the SPA case (`message`: "Extracted content is empty.
      JavaScript-rendered pages (SPA) are not supported in v1."). The
      hint still applies — it describes the class of failure, not a
      single cause — and the arch §10.2 contract says `hint` gives
      generic remediation while `message` carries the specific reason.
      Worth flagging so future readers don't treat the hint as
      redundant or contradictory.
    suggested_action: >
      Optional future polish: make the SPA hint more specific if a
      second SPA-class error emerges. For now, the generic
      "corrupted/empty/scanned" hint is intentionally broad and
      consistent with the arch invariant.

