re_gate_addendum:
  - reGatedAt: "2026-04-19"
    reviewer: "Quinn (@qa)"
    verdict: PASS
    trigger: >
      @po revised AC9 (Change Log v1.5) after @dev's field change (Change
      Log v1.4) replaced the bare-token `docling-extractor/1.0` User-Agent
      with a Mozilla/Chrome-compatible UA + Accept/Accept-Language headers.
      Revision was forced by 403 responses from Cloudflare-fronted publishers
      (repro: https://www.nngroup.com/articles/ai-agents-as-users/).
    what_changed_since_v1_0:
      - "backend/docling_service.py: HTTP_USER_AGENT now Mozilla/Chrome; new constants HTTP_ACCEPT and HTTP_ACCEPT_LANGUAGE; make_http_client() sends all three."
      - "tests/test_docling_service.py: test_make_http_client_uses_documented_config relaxed to assert UA shape (Mozilla/5.0 + Chrome/) and presence of Accept/Accept-Language; test_http_client_sends_user_agent extended to observe all three headers on MockTransport."
      - "tests/conftest.py: make_test_http_client and install_http_client fixtures mirror the full production header set."
    evidence_re_verified:
      - name: "AC9 tests (targeted)"
        command: "uv run pytest tests/test_docling_service.py::test_make_http_client_uses_documented_config tests/test_docling_service.py::test_http_client_sends_user_agent -v"
        result: "2 passed in 9.23s"
      - name: "Full suite (regression)"
        command: "uv run pytest -x -q"
        result: "78 passed (no regressions introduced by the UA change)"
      - name: "Ruff lint"
        command: "uv run ruff check backend/ tests/"
        result: "All checks passed!"
      - name: "Live 403-fix smoke test (out-of-band)"
        command: "make_http_client().get('https://www.nngroup.com/articles/ai-agents-as-users/')"
        result: "status=200, 115,426 bytes, text/html, <title> present"
    security_re_assessment: >
      The identification-via-UA aspect of the original S3 mitigation is lost
      (publisher-side telemetry cannot distinguish us from generic Chrome
      traffic). The blast-radius controls that actually mitigate S3 — 30s
      total timeout, 10s connect timeout, 5-hop redirect cap, explicit
      (non-empty) UA — remain intact. Net risk posture: unchanged for the
      security properties we actually rely on; operational reliability
      materially improved. Recommend a future story to re-introduce opt-in
      identification via a custom `X-Extractor: docling-extractor/<version>`
      header if publisher-side analytics become a requirement (non-blocking).
    story_status: "Remains `Done`. No functional regression; revised AC9 fully met."
