[project]
name = "docling-extractor"
version = "0.1.0"
description = "Local tool that converts URLs (HTML/PDF) and PDF uploads into Obsidian-ready Markdown files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vinicius Bispo" },
]

dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.31",
    "docling>=2.0,<3.0",
    "httpx>=0.27,<0.28",
    "curl-cffi>=0.15,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<0.1",
    "pyyaml>=6.0,<7.0",
    "python-slugify>=8.0,<9.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.4,<0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "frontend*", "output*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
